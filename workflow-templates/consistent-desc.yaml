name: Consistent End-User Meta

on:
  push:
    branches:
      - main
    paths:
      - README.md

jobs:
  meta-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm install --production node-html-parser marked

      - name: Download Hero program
        run: |
          FILE=".github/update-meta.js"
          if [ ! -f "$FILE" ]; then
            echo "Downloading program.."
            curl -o .github/update-meta.js https://raw.githubusercontent.com/darsan-in/.github/main/utils/update-meta.js  
          fi

      - name: Update meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: $(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME: $(echo "${{ github.repository }}" | cut -d'/' -f2)
        run: |
          node ./.github/update-meta.js

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json .github/update-meta.js
          git commit -m 'End-User Meta updated'
          git push
